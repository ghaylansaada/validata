# =============================================================================
# Validata — public project coordinates (safe to commit)
# =============================================================================
# Secrets NEVER belong here. Put them in ~/.gradle/gradle.properties
# (see gradle/maven-central.secrets.example).
group=io.github.ghaylansaada
version=1.0.0
# --- Maven Central (plugin flags; no credentials) ----------------------------
mavenCentralPublishing=true
# First releases: upload only; click Publish in Central Portal.
# Set true later if you want ./gradlew publishToMavenCentral to auto-release.
mavenCentralAutomaticPublishing=false
# Enable signing only in ~/.gradle/gradle.properties (with your GPG key).
# Do not set signAllPublications=true here — it breaks publishToMavenLocal for local builds.
# --- POM (shared by all published modules) -----------------------------------
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/ghaylansaada/validata
POM_LICENSE_NAME=Apache-2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/ghaylansaada/validata
POM_SCM_CONNECTION=scm:git:https://github.com/ghaylansaada/validata.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ghaylansaada/validata.git
POM_DEVELOPER_ID=ghaylansaada
POM_DEVELOPER_NAME=Ghaylan Saada
POM_DEVELOPER_URL=https://github.com/ghaylansaada
# --- KSP ---------------------------------------------------------------------
ksp.incremental=false
# --- Gradle daemon -----------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Enable parallel project execution
org.gradle.parallel=true

# Explicitly set tooling API parallel execution to fix deprecation warning
org.gradle.tooling.parallel=true